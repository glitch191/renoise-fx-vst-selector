name: Release

# Builds the Renoise tool file (.xrnx) when a release is published and
# attaches it to that release with its SHA-256 checksum.
# A manual run only uploads the files as a workflow artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up the compiler needed to build Lua
        uses: step-security/msvc-dev-cmd@v1

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Run the tests
        run: |
          lua tests/run.lua
          lua tests/smoke.lua

      - name: Build the tool file
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG) {
            ./scripts/build-xrnx.ps1 -Tag $env:RELEASE_TAG
          } else {
            ./scripts/build-xrnx.ps1
          }

      - name: Attach the files to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @files --clobber

      - name: Upload the files as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: xrnx
          path: dist/
          if-no-files-found: error
